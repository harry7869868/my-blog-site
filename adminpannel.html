<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Add Post</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-6">
    <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl">
        <h2 class="text-2xl font-bold mb-6 text-center">Write New Post</h2>
        
        <div class="space-y-4">
            <input type="text" id="title" placeholder="Post Title" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none">
            <textarea id="content" rows="5" placeholder="Write your content here..." class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"></textarea>
            <button id="submitBtn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">Publish Post</button>
        </div>
        <p id="status" class="mt-4 text-center text-sm"></p>
        <div class="mt-6 text-center">
            <a href="index.html" class="text-blue-500 underline text-sm">Back to Home</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Same config yahan bhi paste karein
        const firebaseConfig = {
            apiKey: "apiKey: "AIzaSyCS7747elUnYtM3-KySPInrUD_vU1CBKH0",
  authDomain: "myblogdb-3895f.firebaseapp.com",
  projectId: "myblogdb-3895f",
  storageBucket: "myblogdb-3895f.firebasestorage.app",
  messagingSenderId: "577647019408",
  appId: "1:577647019408:web:77d1ffd4312c0ae60adf15"",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('submitBtn').addEventListener('click', async () => {
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const status = document.getElementById('status');

            if(!title || !content) {
                status.innerText = "Please fill all fields!";
                return;
            }

            try {
                await addDoc(collection(db, "posts"), {
                    title: title,
                    content: content,
                    timestamp: serverTimestamp()
                });
                status.style.color = "green";
                status.innerText = "Post Published Successfully!";
                document.getElementById('title').value = '';
                document.getElementById('content').value = '';
            } catch (e) {
                status.style.color = "red";
                status.innerText = "Error: " + e.message;
            }
        });
    </script>
</body>
</html>
